<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trading Analyzer</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1419;--panel:#161c24;--line:#242d38;--tx:#e6e9ee;--mut:#8b96a5;--up:#2ebd85;--dn:#f6465d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
#price{font-size:18px;font-weight:600}
#bias{padding:2px 10px;border-radius:12px;font-weight:600;border:1px solid var(--line)}
.bull{color:var(--up);border-color:var(--up)!important}.bear{color:var(--dn);border-color:var(--dn)!important}
#wrap{position:relative;height:60vh;min-height:300px}
#chart,#ov{position:absolute;inset:0;width:100%;height:100%}#ov{pointer-events:none}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
h2{margin:0 0 8px;font-size:14px}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mut)}
#err{color:var(--dn);padding:0 12px}
</style>
</head>
<body>
<header>
  <select id="coin"></select>
  <select id="tf"><option>5m</option><option selected>15m</option><option>1h</option><option>4h</option><option>1d</option></select>
  <span id="price">-</span><span id="bias">-</span><span class="mu" id="upd"></span>
</header>
<div id="err"></div>
<div id="wrap"><div id="chart"></div><canvas id="ov"></canvas></div>
<main>
  <section><h2>Indicator votes</h2><div id="votes"></div></section>
  <section><h2>Levels</h2><div id="levels"></div></section>
  <section><h2>Recent positions</h2><div id="pos"></div></section>
</main>
<script>
// ===ANALYSIS_START===
const COINS=["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","TRXUSDT"];
const THRESHOLD=6,SL_ATR=1.5,RR=2,MAX_LEN=40;
const ema=(a,n)=>{const k=2/(n+1);let p=a[0];return a.map((x,i)=>(p=i?x*k+p*(1-k):x))};
const rma=(a,n)=>{let p=a[0];return a.map((x,i)=>(p=i?p+(x-p)/n:x))};
const roll=(a,n,f)=>a.map((_,i)=>i<n-1?NaN:f(a.slice(i-n+1,i+1)));
const sma=(a,n)=>roll(a,n,w=>w.reduce((s,x)=>s+x,0)/n);
const sd=(a,n)=>roll(a,n,w=>{const m=w.reduce((s,x)=>s+x,0)/n;return Math.sqrt(w.reduce((s,x)=>s+(x-m)**2,0)/(n-1))});
const rmax=(a,n)=>roll(a,n,w=>Math.max(...w)),rmin=(a,n)=>roll(a,n,w=>Math.min(...w));
const sg=(u,d)=>u?1:d?-1:0;

function analyze(R){
  const n=R.length,t=R.map(r=>r.t),o=R.map(r=>r.o),h=R.map(r=>r.h),l=R.map(r=>r.l),c=R.map(r=>r.c),v=R.map(r=>r.v);
  const tr=c.map((_,i)=>i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[0]-l[0]);
  const atr=(m=14)=>rma(tr,m),a14=atr(14);
  const dl=c.map((x,i)=>i?x-c[i-1]:0);
  const rsiA=rma(dl.map(x=>Math.max(x,0)),14).map((u,i)=>{const d=rma(dl.map(x=>Math.max(-x,0)),14)[i];return 100-100/(1+u/d)});
  const up=h.map((x,i)=>i?x-h[i-1]:0),dn=l.map((x,i)=>i?l[i-1]-x:0);
  const pdi=rma(up.map((u,i)=>u>dn[i]&&u>0?u:0),14).map((x,i)=>100*x/a14[i]);
  const mdi=rma(dn.map((d,i)=>d>up[i]&&d>0?d:0),14).map((x,i)=>100*x/a14[i]);
  const adx=rma(pdi.map((p,i)=>{const s=p+mdi[i];return s?100*Math.abs(p-mdi[i])/s:0}),14);
  // Supertrend
  const a10=atr(10),ub=[],lb=[],fu=[],fl=[],st=[];
  for(let i=0;i<n;i++){const m=(h[i]+l[i])/2;ub[i]=m+3*a10[i];lb[i]=m-3*a10[i];fu[i]=ub[i];fl[i]=lb[i];st[i]=1;
    if(i){fu[i]=(ub[i]<fu[i-1]||c[i-1]>fu[i-1])?ub[i]:fu[i-1];fl[i]=(lb[i]>fl[i-1]||c[i-1]<fl[i-1])?lb[i]:fl[i-1];
      st[i]=st[i-1]==1?(c[i]<fl[i]?-1:1):(c[i]>fu[i]?1:-1)}}
  // Parabolic SAR
  const sar=[1],s=[l[0]];let ep=h[0],af=.02;
  for(let i=1;i<n;i++){const p2=i>1?i-2:i-1;s[i]=s[i-1]+af*(ep-s[i-1]);
    if(sar[i-1]){s[i]=Math.min(s[i],l[i-1],l[p2]);sar[i]=1;
      if(l[i]<s[i]){sar[i]=0;s[i]=ep;ep=l[i];af=.02}else if(h[i]>ep){ep=h[i];af=Math.min(af+.02,.2)}}
    else{s[i]=Math.max(s[i],h[i-1],h[p2]);sar[i]=0;
      if(h[i]>s[i]){sar[i]=1;s[i]=ep;ep=h[i];af=.02}else if(l[i]<ep){ep=l[i];af=Math.min(af+.02,.2)}}}
  // daily levels (prev day high/low/close), VWAP
  const day=t.map(x=>Math.floor(x/86400)),D=new Map();
  day.forEach((d,i)=>{const e=D.get(d);if(!e)D.set(d,{h:h[i],l:l[i],c:c[i]});else{e.h=Math.max(e.h,h[i]);e.l=Math.min(e.l,l[i]);e.c=c[i]}});
  const days=[...D.keys()],pv=day.map(d=>D.get(days[days.indexOf(d)-1]));
  const pH=pv.map(x=>x?x.h:NaN),pL=pv.map(x=>x?x.l:NaN),pC=pv.map(x=>x?x.c:NaN);
  const P=pH.map((x,i)=>(x+pL[i]+pC[i])/3),mid=pH.map((x,i)=>(x+pL[i])/2);
  const vwap=[];let cv=0,cvv=0,cd=-1;
  for(let i=0;i<n;i++){if(day[i]!=cd){cd=day[i];cv=0;cvv=0}const tp=(h[i]+l[i]+c[i])/3;cv+=tp*v[i];cvv+=v[i];vwap[i]=cv/cvv}
  const s50=sma(c,50),s200=sma(c,200),e50=ema(c,50),bm=sma(c,20),bs=sd(c,20);
  const bu=bm.map((x,i)=>x+2*bs[i]),bl=bm.map((x,i)=>x-2*bs[i]);
  const e12=ema(c,12),e26=ema(c,26),macd=e12.map((x,i)=>x-e26[i]),sig=ema(macd,9);
  const lo14=rmin(l,14),hi14=rmax(h,14),K=sma(c.map((x,i)=>100*(x-lo14[i])/(hi14[i]-lo14[i])),3),Dd=sma(K,3);
  const volMA=sma(v,20),swH=rmax(h,8),swL=rmin(l,8);
  const names=["RSI","SMA 50/200","EMA 50","Bollinger","MACD","Supertrend","Parabolic SAR","Pivot","VWAP","Stochastic","Prev-Day 50%"];
  const votes=i=>{const near=Math.abs(c[i]-mid[i])<.05*(pH[i]-pL[i]);return [
    sg(rsiA[i]>50&&rsiA[i]<70,rsiA[i]<50&&rsiA[i]>30),sg(s50[i]>s200[i],s50[i]<s200[i]),sg(c[i]>e50[i],c[i]<e50[i]),
    sg(c[i]<bl[i],c[i]>bu[i]),sg(macd[i]>sig[i]&&macd[i]>0,macd[i]<sig[i]&&macd[i]<0),st[i],sar[i]?1:-1,
    sg(c[i]>P[i],c[i]<P[i]),sg(c[i]>vwap[i],c[i]<vwap[i]),sg(K[i]>Dd[i]&&K[i]>20,K[i]<Dd[i]&&K[i]<80),
    sg(swL[i]<pL[i]&&c[i]>pL[i]&&c[i]<=mid[i]&&!near,swH[i]>pH[i]&&c[i]<pH[i]&&c[i]>=mid[i]&&!near)]};
  const sc=i=>votes(i).reduce((x,y)=>x+y,0),ok=i=>adx[i]>20&&v[i]>volMA[i];
  const pos=[];
  for(let i=210;i<n-1;){
    const S=sc(i),side=S>=THRESHOLD?1:S<=-THRESHOLD?-1:0;
    if(!side||!ok(i)||isNaN(a14[i])){i++;continue}
    const e=c[i],risk=SL_ATR*a14[i],slp=e-side*risk,tpp=e+side*risk*RR;
    let end=Math.min(i+MAX_LEN,n-1),status=i+MAX_LEN>=n-1?"open":"timeout";
    for(let j=i+1;j<=Math.min(i+MAX_LEN,n-1);j++){
      const hs=side==1?l[j]<=slp:h[j]>=slp,ht=side==1?h[j]>=tpp:l[j]<=tpp;
      if(hs||ht){end=j;status=hs?"sl":"tp";break}}
    pos.push({side:side==1?"LONG":"SHORT",t0:t[i],t1:t[end],entry:e,sl:slp,tp:tpp,candles:end-i,status});i=end+1}
  const last=n-1,S=sc(last),vt=votes(last),W=R.slice(-100);
  const Hh=Math.max(...W.map(x=>x.h)),Ll=Math.min(...W.map(x=>x.l));
  const hiI=W.findIndex(x=>x.h==Hh),loI=W.findIndex(x=>x.l==Ll),fib={};
  [.236,.382,.5,.618].forEach(q=>fib[q]=loI<hiI?Hh-(Hh-Ll)*q:Ll+(Hh-Ll)*q);
  const show=R.slice(-300),tMin=show[0].t;
  return {price:c[last],score:S,bias:S>=THRESHOLD?"BULLISH":S<=-THRESHOLD?"BEARISH":"NEUTRAL",
    candles:show.map(r=>({time:r.t,open:r.o,high:r.h,low:r.l,close:r.c})),
    volume:show.map(r=>({time:r.t,value:r.v,color:r.c>=r.o?"#26a69a66":"#ef535066"})),
    votes:Object.fromEntries(names.map((k,i)=>[k,vt[i]])),fib,positions:pos.filter(p=>p.t1>=tMin),
    info:{rsi:rsiA[last],adx:adx[last],vwap:vwap[last],pivot:P[last],prevHigh:pH[last],prevMid:mid[last],prevLow:pL[last],
      bbUpper:bu[last],bbLower:bl[last],volumeOK:v[last]>volMA[last],trendOK:adx[last]>20}};
}
// ===ANALYSIS_END===

const $=id=>document.getElementById(id);
async function klines(sym,itv){
  let err;
  for(const H of ["https://api.binance.com","https://data-api.binance.vision"]){
    try{const r=await fetch(`${H}/api/v3/klines?symbol=${sym}&interval=${itv}&limit=700`);if(!r.ok)throw new Error(r.status);
      return (await r.json()).map(k=>({t:Math.floor(k[0]/1000),o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}))}
    catch(e){err=e}}
  throw new Error("Binance data nahi mila ("+err.message+")");
}
const chart=LightweightCharts.createChart($('chart'),{autoSize:true,
  layout:{background:{color:'#0f1419'},textColor:'#8b96a5'},
  grid:{vertLines:{color:'#1a222b'},horzLines:{color:'#1a222b'}},
  timeScale:{timeVisible:true,rightOffset:25,borderColor:'#242d38'},rightPriceScale:{borderColor:'#242d38'}});
const cs=chart.addCandlestickSeries({upColor:'#2ebd85',downColor:'#f6465d',borderVisible:false,wickUpColor:'#2ebd85',wickDownColor:'#f6465d'});
const vs=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'v'});
chart.priceScale('v').applyOptions({scaleMargins:{top:.85,bottom:0}});
let P=[],first=true;
const fmt=x=>x==null||isNaN(x)?'-':(x>=100?x.toFixed(2):x.toFixed(5));

async function load(){
  $('err').textContent='';
  try{
    const d=analyze(await klines($('coin').value,$('tf').value));
    cs.setData(d.candles);vs.setData(d.volume);P=d.positions;
    if(first){chart.timeScale().fitContent();first=false}
    $('price').textContent=fmt(d.price);
    const b=$('bias');b.textContent=`${d.bias} (${d.score>0?'+':''}${d.score})`;
    b.className=d.bias==='BULLISH'?'bull':d.bias==='BEARISH'?'bear':'';
    $('votes').innerHTML=Object.entries(d.votes).map(([k,x])=>`<div class="row"><span>${k}</span><b class="${x>0?'up':x<0?'dn':'mu'}">${x>0?'BUY':x<0?'SELL':'-'}</b></div>`).join('')
      +`<div class="row"><span>ADX trend filter</span><b class="${d.info.trendOK?'up':'dn'}">${d.info.trendOK?'>20 OK':'<20 sideways'}</b></div>`
      +`<div class="row"><span>Volume confirm</span><b class="${d.info.volumeOK?'up':'dn'}">${d.info.volumeOK?'OK':'weak'}</b></div>`;
    const i=d.info,L=[['RSI',i.rsi.toFixed(1)],['ADX',i.adx.toFixed(1)],['VWAP',fmt(i.vwap)],['Pivot',fmt(i.pivot)],
      ['Prev-day High',fmt(i.prevHigh)],['Prev-day 50%',fmt(i.prevMid)],['Prev-day Low',fmt(i.prevLow)],
      ['BB upper',fmt(i.bbUpper)],['BB lower',fmt(i.bbLower)],...Object.entries(d.fib).map(([k,x])=>['Fib '+k,fmt(x)])];
    $('levels').innerHTML=L.map(([k,x])=>`<div class="row"><span>${k}</span><span>${x}</span></div>`).join('');
    $('pos').innerHTML=[...P].reverse().slice(0,8).map(p=>`<div class="row"><span class="${p.side==='LONG'?'up':'dn'}">${p.side} ${fmt(p.entry)}</span><span class="mu">${p.candles} candles · ${p.status.toUpperCase()}</span></div>`).join('')||'<span class="mu">Abhi koi signal nahi</span>';
    $('upd').textContent=new Date().toLocaleTimeString();
  }catch(e){$('err').textContent='Error: '+e.message}
}
const cv=$('ov'),ctx=cv.getContext('2d');
function draw(){
  const w=$('wrap'),r=devicePixelRatio||1,W=w.clientWidth,H=w.clientHeight;
  if(cv.width!==W*r||cv.height!==H*r){cv.width=W*r;cv.height=H*r}
  ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,W,H);
  const ts=chart.timeScale(),bs=ts.options().barSpacing;
  for(const p of P){
    let x1=ts.timeToCoordinate(p.t0),x2=ts.timeToCoordinate(p.t1);
    if(x1==null&&x2==null)continue;
    x1=x1??0;x2=(x2??W)+bs;
    const ye=cs.priceToCoordinate(p.entry),yt=cs.priceToCoordinate(p.tp),ys=cs.priceToCoordinate(p.sl);
    if(ye==null||yt==null||ys==null)continue;
    const wd=x2-x1;
    ctx.fillStyle='rgba(46,189,133,.22)';ctx.fillRect(x1,Math.min(ye,yt),wd,Math.abs(yt-ye));
    ctx.fillStyle='rgba(246,70,93,.22)';ctx.fillRect(x1,Math.min(ye,ys),wd,Math.abs(ys-ye));
    ctx.strokeStyle='#cfd6e0';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x1,ye);ctx.lineTo(x1+wd,ye);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=p.side==='LONG'?'#2ebd85':'#f6465d';ctx.font='600 11px system-ui';
    ctx.fillText(`${p.side} 1:2 ${p.candles} candles ${p.status.toUpperCase()}`,x1+4,Math.min(ye,yt,ys)+12);
    ctx.fillStyle='#8b96a5';ctx.font='10px system-ui';
    ctx.fillText('TP '+fmt(p.tp),x1+4,yt+(yt<ye?12:-4));ctx.fillText('SL '+fmt(p.sl),x1+4,ys+(ys<ye?12:-4));
  }
  requestAnimationFrame(draw);
}
$('coin').innerHTML=COINS.map(c=>`<option>${c}</option>`).join('');
$('coin').onchange=$('tf').onchange=()=>{first=true;load()};
load();draw();setInterval(load,20000);
</script>
</body>
</html>
